name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            coverage: true
          - python-version: "3.12"
            coverage: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Run tests with branch coverage
        if: ${{ matrix.coverage == true }}
        run: python -m coverage run -m pytest && python -m coverage report
      - name: Run tests
        if: ${{ matrix.coverage == false }}
        run: python -m pytest

  release-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build pytest
      - run: python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Test the extracted source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/delibrashift-*
          python -m pytest
      - name: Test installed wheel and scientific gates
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          python tests/release_smoke.py \
            --venv "$RUNNER_TEMP/release-venv" \
            --wheel "$RUNNER_TEMP"/dist/*.whl \
            --workspace "$GITHUB_WORKSPACE"

  offline-report:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[dev]'
      - name: Install report test dependency
        run: npm ci
        working-directory: report
      - name: Install Chromium for the browser smoke test
        run: npx playwright install --with-deps chromium
        working-directory: report
      - name: Build the canonical offline report
        run: python report/build_report.py
      - name: Run report tests and independent physics audit
        run: |
          npm --prefix report test
          npm --prefix report run test:browser
          node desktop/tests/visual_smoke.js
          python report/tests/audit_truth.py
      - name: Reject private paths and credentials in the artifact
        run: |
          ! grep -Eq '/home/|192\.168\.|NVIDIA_API_KEY|Authorization: Bearer' \
            report/delibrashift_report.html
