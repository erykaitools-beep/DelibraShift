name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            coverage: true
          - python-version: "3.12"
            coverage: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Run tests with branch coverage
        if: ${{ matrix.coverage == true }}
        run: python -m coverage run -m pytest && python -m coverage report
      - name: Run tests
        if: ${{ matrix.coverage == false }}
        run: python -m pytest

  release-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build
      - run: python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Test installed wheel and scientific gates
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          python tests/release_smoke.py \
            --venv "$RUNNER_TEMP/release-venv" \
            --wheel "$RUNNER_TEMP"/dist/*.whl \
            --workspace "$GITHUB_WORKSPACE"
