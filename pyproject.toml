[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delibrashift"
version = "0.1.0"
description = "A deliberation-aware benchmark for diagnosing agent cognition"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eryk Wyrębek" }]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
delibrashift-demo = "delibrashift.demo:main"
delibrashift-run = "delibrashift.cli:main"
delibrashift-gates = "delibrashift.gate_cli:main"
delibrashift-pack = "delibrashift.archive_cli:main"
delibrashift-ablate = "delibrashift.experiment_cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "coverage[toml]>=7.6", "pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["delibrashift"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = ["delibrashift*"]
