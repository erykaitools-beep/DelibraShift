[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delibrashift"
version = "0.1.0"
description = "A deliberation-aware benchmark for diagnosing agent cognition"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DelibraShift contributors" }]
dependencies = []

[project.scripts]
delibrashift-demo = "delibrashift.demo:main"
delibrashift-run = "delibrashift.cli:main"
delibrashift-gates = "delibrashift.gate_cli:main"
delibrashift-pack = "delibrashift.archive_cli:main"
delibrashift-ablate = "delibrashift.experiment_cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["delibrashift*"]
