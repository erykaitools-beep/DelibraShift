[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronogym"
version = "0.0.0"
description = "A deliberation-aware benchmark for diagnosing agent cognition"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ChronoGym contributors" }]
dependencies = []

[project.scripts]
chronogym-demo = "chronogym.demo:main"
chronogym-run = "chronogym.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
